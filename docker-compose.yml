services:
  graphdb:
    image: ontotext/graphdb:10.8.14@sha256:506096f8b30c44994d457551f668fa1283596cfc7098bdb915f9b6b708ec2f44
    container_name: ripe_kg_graphdb
    environment:
      GDB_HEAP_SIZE: 2g
    mem_limit: 4g
    cpus: 2
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
      - ./knowledge:/opt/graphdb/home/import
    restart: unless-stopped

volumes:
  graphdb_data:
